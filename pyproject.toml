[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrobar"
version = "1.23.0"
description = "Classic Windows taskbar for KDE Plasma on Wayland, using RetroBar's XAML themes"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pywayland>=0.4.18",
    # PyQt6 and dbus-python come from the distribution (python3-pyqt6, python3-dbus);
    # create the virtual environment with --system-site-packages.
]

[project.optional-dependencies]
pip-gui = ["PyQt6>=6.5", "dbus-python>=1.3"]
test = ["pytest>=8"]

[project.scripts]
retrobar = "retrobar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
